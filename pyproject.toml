[project]
name = "dj-set-copyright-check"
version = "0.1.0"
description = "Check a Rekordbox playlist against YouTube's Content ID before recording a DJ set."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "mutagen>=1.47",
]

[project.scripts]
check-set = "check_set.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/check_set"]

[tool.pytest.ini_options]
testpaths = ["tests"]
